name: CI

# Runs on every commit pushed to a working branch, and on every PR opened
# against develop or main, so lint/build failures surface before a merge.
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'design/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
